name: myxfc CI and packages

on:
  push:
    tags:
      - "**"

jobs:
  win-build:
    runs-on: windows-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build Windows package
        run: .\jpackage\winPack.bat ${{ github.ref_name }}
      - id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./target/myxfc-win.zip
          asset_name: myxfc-win.zip
          asset_content_type: application/zip

  linux-build:
    needs: win-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build Linux package
        run: MVN=mvn bash jpackage/linuxPack ${{ github.ref_name }}
      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.win-build.outputs.upload_url }}
          asset_path: ./target/myxfc-linux.zip
          asset_name: myxfc-linux.zip
          asset_content_type: application/zip

  mac-build:
    needs: win-build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build macOS package
        run: MVN=mvn bash jpackage/macPack ${{ github.ref_name }}
      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.win-build.outputs.upload_url }}
          asset_path: ./target/myxfc-mac-arm64.zip
          asset_name: myxfc-mac-arm64.zip
          asset_content_type: application/zip
